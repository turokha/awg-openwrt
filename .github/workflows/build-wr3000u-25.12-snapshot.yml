name: Build AWG 3.1 for WR3000U 25.12-SNAPSHOT

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout AWG sources
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk gcc-multilib \
            gettext git libncurses-dev libssl-dev \
            python3 python3-setuptools rsync swig unzip \
            zlib1g-dev file wget zstd

      - name: Download exact OpenWrt SDK
        run: |
          wget \
            https://downloads.openwrt.org/releases/25.12-SNAPSHOT/targets/mediatek/filogic/openwrt-sdk-25.12-SNAPSHOT-mediatek-filogic_gcc-14.3.0_musl.Linux-x86_64.tar.zst

          echo "b3faa4b0ef9cad1cd9504d8e5c392a121119273f0bffe6e545eb354bf08a13e1  openwrt-sdk-25.12-SNAPSHOT-mediatek-filogic_gcc-14.3.0_musl.Linux-x86_64.tar.zst" \
            | sha256sum -c -

      - name: Extract SDK
        run: |
          tar --zstd -xf openwrt-sdk-25.12-SNAPSHOT-mediatek-filogic_gcc-14.3.0_musl.Linux-x86_64.tar.zst

          SDK_DIR="$(find "$GITHUB_WORKSPACE" -maxdepth 1 -type d -name 'openwrt-sdk-*' | head -n1)"

          test -n "$SDK_DIR"
          echo "SDK_DIR=$SDK_DIR" >> "$GITHUB_ENV"

          echo "SDK: $SDK_DIR"

      - name: Prepare feeds and AWG packages
        run: |
          cd "$SDK_DIR"

          ./scripts/feeds update -a
          ./scripts/feeds install -a

          cp -r "$GITHUB_WORKSPACE/kmod-amneziawg" package/
          cp -r "$GITHUB_WORKSPACE/amneziawg-tools" package/
          cp -r "$GITHUB_WORKSPACE/luci-proto-amneziawg" package/

          cat > .config <<'EOF'
          CONFIG_PACKAGE_kmod-amneziawg=m
          CONFIG_PACKAGE_amneziawg-tools=y
          CONFIG_PACKAGE_luci-proto-amneziawg=y
          CONFIG_PACKAGE_luci-i18n-amneziawg-ru=y
          EOF

          make defconfig

      - name: Build AWG
        run: |
          cd "$SDK_DIR"
          make package/luci-proto-amneziawg/compile V=s

      - name: Collect packages
        run: |
          mkdir -p "$GITHUB_WORKSPACE/awg-packages"

          find "$SDK_DIR/bin" -type f \
            \( \
              -name 'kmod-amneziawg*.apk' \
              -o -name 'amneziawg-tools*.apk' \
              -o -name 'luci-proto-amneziawg*.apk' \
              -o -name 'luci-i18n-amneziawg-ru*.apk' \
            \) \
            -exec cp -v {} "$GITHUB_WORKSPACE/awg-packages/" \;

          echo "=== BUILT FILES ==="
          ls -lh "$GITHUB_WORKSPACE/awg-packages"

          cd "$GITHUB_WORKSPACE/awg-packages"
          sha256sum *.apk | tee SHA256SUMS.txt

          test "$(find . -maxdepth 1 -name 'kmod-amneziawg*.apk' | wc -l)" -ge 1
          test "$(find . -maxdepth 1 -name 'amneziawg-tools*.apk' | wc -l)" -ge 1
          test "$(find . -maxdepth 1 -name 'luci-proto-amneziawg*.apk' | wc -l)" -ge 1

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: awg-wr3000u-r33298-kernel-6.12.112
          path: awg-packages/
          if-no-files-found: error
